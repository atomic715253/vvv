name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Fix Directory Structure & Wrapper
      run: |
        if [ -d "VlessVpnApp" ]; then
          echo "Found VlessVpnApp folder, copying to root..."
          cp -r VlessVpnApp/* . || true
        fi
        if [ ! -f "gradlew" ]; then
          echo "Generating gradlew wrapper..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VlessVpn-APK
        path: "**/outputs/apk/debug/*.apk"
